name: Build Check

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # =====================
    # Backend (.NET)
    # =====================
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore Backend
      run: |
        cd backend
        dotnet restore

    - name: Build Backend
      run: |
        cd backend
        dotnet build --configuration Release

    # =====================
    # Frontend (React)
    # =====================
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 10.9.3

    - name: Install Frontend
      run: |
        cd frontend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build